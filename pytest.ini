[pytest]
# Pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts = -v --tb=short --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    camera: marks tests that require camera (deselect with '-m "not camera"')

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Coverage settings (when using pytest-cov)
[coverage:run]
source = src
omit = tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
